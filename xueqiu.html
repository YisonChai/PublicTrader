<header class="top"><div><a class="brand" href="./">PublicTrader</a><a class="back" href="https://github.com/YisonChai/PublicTrader">GitHub 仓库 ↗</a></div></header>
<main class="wrap">
  <div class="heading"><div><h1>雪球组合收益曲线</h1><p>运行中的模拟组合与各自基准，默认展示全部历史。</p></div><p class="snapshot" id="snapshot"></p></div>
  <div class="workspace">
    <aside class="panel directory" aria-labelledby="directory-title">
      <div class="controls">
        <h2 id="directory-title">组合目录</h2>
        <input id="filter" type="search" aria-label="搜索组合名称或代码" placeholder="搜索组合名称或代码">
        <div class="filterline"><span class="count" id="count" role="status"></span><select id="sort" aria-label="组合排序"><option value="code">按代码</option><option value="return">按累计收益</option></select></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="panel detail" id="detail" aria-labelledby="title">
      <div class="detail-head"><div><h2 id="title"></h2><p id="period"></p></div><a class="source" id="source" target="_blank" rel="noopener noreferrer">雪球原页 ↗</a></div>
      <div class="chart-head"><h3>累计收益率 · 全部</h3><div class="legend" id="legend"></div></div>
      <div class="chart"><canvas id="plot" tabindex="0" aria-label="累计收益率曲线，使用左右方向键查看日期"></canvas><div class="tooltip" id="tooltip" hidden></div></div>
      <p class="chart-note">移动指针或使用左右方向键查看每日收益率。基准沿用雪球原始序列。</p>
    </section>
  </div>
  <p class="footer">数据来源为雪球组合收益序列。模拟组合收益不等同于实际投资业绩。</p>
  <noscript><p>请启用 JavaScript 查看曲线。</p></noscript>
</main>

<script type="module">
const compressed = Uint8Array.from(atob(document.getElementById("data").textContent), (character) => character.charCodeAt(0));
const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
const records = await new Response(stream).json();
function unpackPoints(encoded) {
  const bytes = atob(encoded);
  let cursor = 0;
  let tradingDay = 0;
  let hundredths = 0;
  const points = [];
  function readUnsigned() {
    let result = 0;
    let multiplier = 1;
    for (; cursor < bytes.length; multiplier *= 128) {
      const byte = bytes.charCodeAt(cursor++);
      result += (byte & 127) * multiplier;
      if (byte < 128) return result;
    }
    throw new Error("收益序列不完整");
  }
  while (cursor < bytes.length) {
    tradingDay += readUnsigned();
    const delta = readUnsigned();
    hundredths += delta % 2 === 0 ? delta / 2 : -(delta + 1) / 2;
    points.push([new Date(tradingDay * 86400000).toISOString().slice(0, 10), hundredths / 100]);
  }
  return points;
}
for (const row of records) {
  for (const s of row.series) s.points = unpackPoints(s.data);
}
const get = (id) => document.getElementById(id);
const list = get("list");
const filter = get("filter");
const sort = get("sort");
const plot = get("plot");
const tooltip = get("tooltip");
const ctx = plot.getContext("2d");
const colors = ["#ad205e", "#165fb7", "#467258"];
const day = 86400000;
const fullPercent = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "exceptZero" });
const axisPercent = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 });
const percent = (value) => fullPercent.format(value) + "%";
const primaryPoints = (row) => row.series[0].points;
const latest = (row) => primaryPoints(row).at(-1)[1];
const epoch = (date) => Date.parse(date) / day;
const iso = (time) => new Date(time * day).toISOString().slice(0, 10);
const timeFormat = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Taipei", dateStyle: "medium" });
const maxCapture = records.map((record) => record.capturedAt).sort().at(-1);
get("snapshot").textContent = timeFormat.format(new Date(maxCapture)) + " 采集";
let active = records.find((record) => "#" + record.code === location.hash) || records.find((record) => record.code === "ZH1332574") || records[0];
let series;
let timeline;
let focusedDay = null;
let geometry;

function renderList() {
  const query = filter.value.trim().toLocaleLowerCase();
  const matches = records.filter((row) => (row.name + " " + row.code).toLocaleLowerCase().includes(query));
  if (sort.value === "return") matches.sort((a, b) => latest(b) - latest(a) || a.code.localeCompare(b.code));
  get("count").textContent = matches.length + " / " + records.length + " 个组合";
  list.replaceChildren();
  if (!matches.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "没有匹配的组合";
    list.append(empty);
  }
  for (const row of matches) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "row";
    button.dataset.code = row.code;
    button.setAttribute("aria-current", String(row === active));
    const title = document.createElement("span");
    const name = document.createElement("strong");
    const code = document.createElement("small");
    const value = document.createElement("span");
    name.textContent = row.name;
    code.textContent = row.code;
    value.className = "value" + (latest(row) < 0 ? " neg" : "");
    value.textContent = percent(latest(row));
    title.append(name, code);
    button.append(title, value);
    button.addEventListener("click", () => {
      history.replaceState(null, "", "#" + row.code);
      choose(row);
      if (matchMedia("(max-width:760px)").matches) get("detail").scrollIntoView({ block: "start" });
    });
    list.append(button);
  }
}

function choose(row) {
  active = row;
  focusedDay = null;
  tooltip.hidden = true;
  get("title").textContent = row.name;
  const points = primaryPoints(row);
  get("period").textContent = row.code + " · " + points[0][0] + " 至 " + points.at(-1)[0] + " · " + points.length.toLocaleString("zh-CN") + " 个数据点";
  get("source").href = row.source;
  series = row.series.map((s, i) => ({
    name: i === 0 ? "组合" : s.name,
    color: colors[i % colors.length],
    points: s.points.map(([date, value]) => [epoch(date), value]),
    byDay: new Map(s.points.map(([date, value]) => [epoch(date), value])),
  }));
  timeline = [...new Set(series.flatMap((s) => [...s.byDay.keys()]))].sort((a, b) => a - b);
  const legend = get("legend");
  legend.replaceChildren();
  for (const s of series) {
    const entry = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.style.backgroundColor = s.color;
    swatch.setAttribute("aria-hidden", "true");
    entry.title = "末点日期 " + iso(s.points.at(-1)[0]);
    entry.append(swatch, s.name + " " + percent(s.points.at(-1)[1]));
    legend.append(entry);
  }
  for (const button of list.querySelectorAll(".row")) {
    button.setAttribute("aria-current", String(button.dataset.code === row.code));
  }
  render();
}

function gridStep(span) {
  const raw = span / 5;
  const power = 10 ** Math.floor(Math.log10(raw));
  return ([1, 2, 2.5, 5, 10].find((n) => n >= raw / power) || 10) * power;
}

function render() {
  const w = plot.clientWidth;
  const h = plot.clientHeight;
  if (w < 100 || h < 100) return;
  const scale = window.devicePixelRatio || 1;
  plot.width = Math.round(w * scale);
  plot.height = Math.round(h * scale);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const values = series.flatMap((s) => s.points.map((p) => p[1]));
  const lo = Math.min(0, ...values);
  const hi = Math.max(0, ...values);
  const step = gridStep(Math.max(1, hi - lo));
  const min = Math.floor((lo - step * 0.08) / step) * step;
  const max = Math.ceil((hi + step * 0.08) / step) * step;
  ctx.font = "11px Inter, system-ui, sans-serif";
  const left = Math.max(ctx.measureText(axisPercent.format(max) + "%").width, ctx.measureText(axisPercent.format(min) + "%").width) + 13;
  const right = w - 14;
  const top = 21;
  const bottom = h - 36;
  const start = timeline[0];
  const finish = timeline.at(-1);
  const span = Math.max(finish - start, 1);
  const x = (t) => left + (t - start) * (right - left) / span;
  const y = (v) => bottom - (v - min) * (bottom - top) / (max - min);
  geometry = { left, right, start, finish, x };
  ctx.fillStyle = "#526473";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i <= Math.round((max - min) / step); i++) {
    const value = min + i * step;
    const py = y(value);
    ctx.strokeStyle = Math.abs(value) < step / 1000 ? "#aab7c1" : "#e1e8ed";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, py);
    ctx.lineTo(right, py);
    ctx.stroke();
    ctx.fillText(axisPercent.format(value) + "%", left - 7, py);
  }
  const ticks = w < 440 ? 3 : w < 700 ? 5 : 7;
  for (let i = 0; i < ticks; i++) {
    const t = Math.round(start + (finish - start) * i / (ticks - 1));
    ctx.textAlign = i === 0 ? "left" : i === ticks - 1 ? "right" : "center";
    ctx.fillText(iso(t), x(t), h - 17);
  }
  for (const s of [...series].reverse()) {
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = 1.65;
    ctx.lineJoin = "round";
    ctx.beginPath();
    s.points.forEach(([t, value], i) => i === 0 ? ctx.moveTo(x(t), y(value)) : ctx.lineTo(x(t), y(value)));
    ctx.stroke();
    const [t, value] = s.points.at(-1);
    ctx.beginPath();
    ctx.arc(x(t), y(value), 3, 0, Math.PI * 2);
    ctx.fill();
  }
  if (focusedDay !== null) {
    const cursorX = x(focusedDay);
    ctx.strokeStyle = "#61717f";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(cursorX, top);
    ctx.lineTo(cursorX, bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    for (const s of series) {
      if (!s.byDay.has(focusedDay)) continue;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(cursorX, y(s.byDay.get(focusedDay)), 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function showDay(t) {
  focusedDay = t;
  tooltip.textContent = [iso(t), ...series.filter((s) => s.byDay.has(t)).map((s) => s.name + "  " + percent(s.byDay.get(t)))].join("\n");
  tooltip.hidden = false;
  tooltip.style.left = Math.max(8, Math.min(geometry.x(t) + 22, plot.clientWidth - tooltip.offsetWidth + 8)) + "px";
  render();
}

function clearDay() {
  focusedDay = null;
  tooltip.hidden = true;
  render();
}

function nearestDay(t) {
  let lo = 0;
  let hi = timeline.length - 1;
  while (lo < hi) {
    const middle = (lo + hi) >> 1;
    if (timeline[middle] < t) lo = middle + 1;
    else hi = middle;
  }
  return lo > 0 && t - timeline[lo - 1] < timeline[lo] - t ? timeline[lo - 1] : timeline[lo];
}

filter.addEventListener("input", renderList);
sort.addEventListener("change", renderList);
plot.addEventListener("pointermove", (event) => {
  if (!geometry) return;
  const pos = event.clientX - plot.getBoundingClientRect().left;
  const fraction = Math.max(0, Math.min(1, (pos - geometry.left) / (geometry.right - geometry.left)));
  const t = nearestDay(geometry.start + (geometry.finish - geometry.start) * fraction);
  if (t !== focusedDay) showDay(t);
});
plot.addEventListener("pointerleave", clearDay);
plot.addEventListener("blur", clearDay);
plot.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key !== "Escape") return;
  event.preventDefault();
  if (event.key === "Escape") {
    clearDay();
    return;
  }
  const current = focusedDay === null ? timeline.length - 1 : timeline.indexOf(focusedDay);
  const direction = event.key === "ArrowLeft" ? -1 : 1;
  showDay(timeline[Math.max(0, Math.min(timeline.length - 1, current + direction))]);
});
addEventListener("hashchange", () => {
  const selected = records.find((row) => "#" + row.code === location.hash);
  if (selected) choose(selected);
});
new ResizeObserver(render).observe(plot);
renderList();
choose(active);
</script>
